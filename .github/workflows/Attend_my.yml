name: Attend_my

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  Run1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install
      - name: Run
        run: node src/index.js
        env:
          USER_INFO: ${{ secrets.USER_INFO }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          BARK_ID: ${{ secrets.BARK_ID }}

  Run2:
    runs-on: ubuntu-latest
    needs: Run1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install
      - name: Run
        run: node src/index.js
        env:
          USER_INFO: ${{ secrets.USER_INFO }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          BARK_ID: ${{ secrets.BARK_ID }}

  Run3:
    runs-on: ubuntu-latest
    needs: Run2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install
      - name: Run
        run: node src/index.js
        env:
          USER_INFO: ${{ secrets.USER_INFO }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          BARK_ID: ${{ secrets.BARK_ID }}
