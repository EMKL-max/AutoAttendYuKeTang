name: Attend_my

# cron 用 UTC 时间，北京时间 = UTC + 8
# '0 23 * * *' = UTC 23:00 = 北京时间 07:00
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  Run1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn

      - name: Run
        run: node src/index.js
        env:
          USER_INFO: ${{ secrets.USER_INFO }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          BARK_ID: ${{ secrets.BARK_ID }}

  Run2:
    runs-on: ubuntu-latest
    needs: Run1
    steps:
      # ... 与 Run1 完全相同的 5 个步骤 ...

  Run3:
    runs-on: ubuntu-latest
    needs: Run2
    steps:
      # ... 与 Run1 完全相同的 5 个步骤 ...
